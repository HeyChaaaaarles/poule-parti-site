<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poule Parti - Accueil</title>
    <script src="scripts/home.js" defer></script>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="icon" type="image/png" href="/extras/normal_logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="logoContainer">
            <img class="logo" src="/extras/normal_logo.png" alt="logo">
            <h1>Poule Parti</h1>
        </div>
        <div class="headerContainer">
        </div>
    </header>
    <div class="lowerBody">
        <div id="pages-switch-container" class="pages-switch-container">
            <button id="cloud" class="pages-button">☁️ Cloud</button>
            <button id="mailito" class="pages-button">✉️ Poule Parti Mails</button>
            <button id="stats" class="pages-button">📈 Stats</button>
            <button id="gogole" class="pages-button">🔎 Gogole</button>
        </div>
        <div id="theme-switch-container" class="theme-switch-container">
            <label class="switch">
                <input type="checkbox" id="theme-toggle" class="theme-toggle">
                <span class="slider round">
            <span class="icon sun">☀️</span>
            <span class="icon moon">🌙 </span>
        </span>
            </label>
        </div>

    </div>
</body>
</html>
